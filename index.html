<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SC過去問トレーニング</title>
    <meta name="description" content="情報処理安全確保支援士・応用情報技術者の午前問題をスマホで反復学習できるPWAアプリ" />

    <meta name="theme-color" content="#1e3a5f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SC過去問" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <script>
      (function () {
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function (isDark) {
          document.documentElement.classList.toggle("dark", isDark);
        };
        apply(media.matches);
        media.addEventListener("change", function (event) {
          apply(event.matches);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
